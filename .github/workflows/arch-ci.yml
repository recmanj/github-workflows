name: Arch package CI

# See docs/arch-ci.md
on:
  workflow_call:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Same image as arch-update.yml
    container: archlinux:base-devel-20261122.0.629543@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/scripts

      - name: Validate
        shell: bash
        run: '"$WORKFLOWS_DIR"/arch/validate.sh'
