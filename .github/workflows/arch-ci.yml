name: Arch package CI

# Validates a PKGBUILD repo, see README.md
on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/scripts

      - name: Validate
        shell: bash
        run: '"$WORKFLOWS_DIR"/arch/validate.sh'
