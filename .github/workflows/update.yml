name: Update

# See docs/update.md
on:
  workflow_call:
    inputs:
      check:
        description: Command that prints the version to update to, or nothing when up to date
        type: string
        required: true
      apply:
        description: Command that updates the files to $VERSION. It must not run anything from the new version.
        type: string
        required: true
      validate:
        description: Command that tests the change, with a read-only token
        type: string
        default: ''
      setup:
        description: Command run at the start of every job, before the checkout. Only use it to install tools.
        type: string
        default: ''
      runs-on:
        type: string
        default: ubuntu-latest
      container:
        description: Image to run every job in
        type: string
        default: ''
      timeout-minutes:
        description: Timeout of the validate job
        type: number
        default: 60
      title:
        description: Commit message and pull request title. {version} is replaced with the version.
        type: string
        default: Update to {version}
      body:
        description: Pull request body. {version} is replaced with the version.
        type: string
        default: ''
      ci-workflow:
        description: >-
          Workflow to run on the new branch, since pull requests opened with
          GITHUB_TOKEN do not trigger workflows
        type: string
        default: ''

permissions: {}

defaults:
  run:
    shell: bash

# check runs apply once and passes the diff to the other jobs as an output.
# validate tests that diff, and is the only job that runs the new version.
# publish commits the same diff, and is the only job with a write token. It runs
# no command from the caller other than setup.
jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }} # zizmor: ignore[unpinned-images] the caller pins it
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # look up existing update PRs
    outputs:
      version: ${{ steps.check.outputs.version }}
      patch: ${{ steps.diff.outputs.patch }}
    steps:
      - name: Set up
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: eval "$SETUP"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/scripts

      - name: Check for a new version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK: ${{ inputs.check }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(eval "$CHECK")
          if [[ -z $version ]]; then
            echo 'Up to date'
            exit 0
          fi
          branch="update/$version"
          if [[ ! $version =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] ||
            ! git check-ref-format --branch "$branch" > /dev/null; then
            echo "::error::Invalid version: $version"
            exit 1
          fi

          # A PR in any state and against any branch means this version was
          # handled, and publish would overwrite its branch. A branch without
          # a PR is left over from a failed run and gets overwritten. Matching
          # on owner:branch leaves out fork PRs, which anyone can open from a
          # branch with this name.
          if [[ -n $(gh api -X GET "repos/$GH_REPO/pulls" -f head="${GH_REPO%%/*}:$branch" \
            -f state=all --jq '.[].number') ]]; then
            echo "PR for $branch already exists, skipping"
            exit 0
          fi

          echo "Updating to $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Apply
        if: steps.check.outputs.version != ''
        env:
          VERSION: ${{ steps.check.outputs.version }}
          APPLY: ${{ inputs.apply }}
        run: eval "$APPLY"

      - name: Save the diff
        id: diff
        if: steps.check.outputs.version != ''
        run: |
          git add --update
          if git diff --cached --quiet; then
            echo '::error::apply changed no tracked files'
            exit 1
          fi
          git diff --cached --stat
          # Compressed, as the later jobs get it in an environment variable,
          # which Linux limits to 128 KiB
          patch=$(git diff --cached --binary | gzip -9n | base64 -w0)
          if (( ${#patch} > 100000 )); then
            echo '::error::The diff is too large to pass to the other jobs'
            exit 1
          fi
          echo "patch=$patch" >> "$GITHUB_OUTPUT"

  validate:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }} # zizmor: ignore[unpinned-images] the caller pins it
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Set up
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: eval "$SETUP"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/scripts

      - name: Apply the diff
        env:
          PATCH: ${{ needs.check.outputs.patch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base64 -d <<< "$PATCH" | gunzip | git apply --index

      - name: Validate
        if: inputs.validate != ''
        env:
          VERSION: ${{ needs.check.outputs.version }}
          VALIDATE: ${{ inputs.validate }}
        run: eval "$VALIDATE"

  publish:
    needs: [check, validate]
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }} # zizmor: ignore[unpinned-images] the caller pins it
    timeout-minutes: 15
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the PR
      actions: write # run ci-workflow on the branch
    steps:
      - name: Set up
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: eval "$SETUP"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PATCH: ${{ needs.check.outputs.patch }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          branch="update/$VERSION"
          title=${TITLE//'{version}'/$VERSION}
          body=${BODY//'{version}'/$VERSION}
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          base64 -d <<< "$PATCH" | gunzip | git apply --index
          git commit -m "$title"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "$branch"
          url=$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body "$body")
          echo "$url"
          if [[ -n $CI_WORKFLOW ]]; then
            gh workflow run "$CI_WORKFLOW" --ref "$branch"
          fi

          # Close the update PRs this one replaces, like Dependabot does. Only
          # PRs this workflow opened, so other update/ branches are left alone.
          gh pr list --base "$BASE" --state open --limit 1000 \
            --json number,headRefName,isCrossRepository,author \
            --jq '.[] | select(.isCrossRepository | not) | select(.author.login == "app/github-actions")
              | select(.headRefName | startswith("update/")) | "\(.number) \(.headRefName)"' |
            while read -r number head; do
              if [[ $head != "$branch" ]] &&
                ! gh pr close "$number" --delete-branch --comment "Superseded by #${url##*/}."; then
                echo "::warning::Failed to close superseded PR #$number"
              fi
            done
