name: Arch package update

# See docs/arch-update.md
on:
  workflow_call:
    inputs:
      body:
        description: Pull request body. {version} is replaced with the version.
        type: string
        default: ''
      ci-workflow:
        description: Workflow to run on the new branch
        type: string
        default: ci.yml

permissions: {}

jobs:
  update:
    uses: $/.github/workflows/update.yml
    permissions:
      contents: write # see update.yml
      pull-requests: write
      actions: write
    with:
      # Updated by hand, Dependabot does not handle images in workflows
      container: archlinux:base-devel-20261122.0.629543@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91
      setup: >-
        pacman -Sy --noconfirm --needed archlinux-keyring &&
        pacman -Su --noconfirm --needed git github-cli
      check: '"$WORKFLOWS_DIR"/arch/check.sh'
      apply: '"$WORKFLOWS_DIR"/arch/bump.sh "$VERSION"'
      validate: '"$WORKFLOWS_DIR"/arch/validate.sh'
      body: ${{ inputs.body }}
      ci-workflow: ${{ inputs.ci-workflow }}
