name: Workflow scripts
description: Sets WORKFLOWS_DIR to this repository at the commit being run
runs:
  using: composite
  steps:
    - shell: bash
      # The value is the runner's own path, not something a caller controls
      run: | # zizmor: ignore[github-env]
        echo "WORKFLOWS_DIR=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)" >> "$GITHUB_ENV"
